version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: warcoat-db
    environment:
      POSTGRES_USER: warcoat
      POSTGRES_PASSWORD: warcoat
      POSTGRES_DB: warcoat
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - warcoat-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U warcoat"]
      interval: 5s
      timeout: 5s
      retries: 5

  db-migration:
    build:
      context: db
      dockerfile: Dockerfile
    container_name: warcoat-migration
    depends_on:
      db:
        condition: service_healthy
    networks:
      - warcoat-network

  discord-bot:
    build:
      context: bot
      dockerfile: Dockerfile
    container_name: warcoat-bot
    depends_on:
      db-migration:
        condition: service_completed_successfully
    networks:
      - warcoat-network
    restart: unless-stopped

networks:
  warcoat-network:
    driver: bridge

volumes:
  postgres_data: