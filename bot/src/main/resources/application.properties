spring.application.name=warcoat

# Discord Bot Configuration
discord.bot.token=${DISCORD_BOT_TOKEN}
# Activity format: TYPE:message or STREAMING:url:message                                                                                                                                                                                                                                                  ? ?
discord.bot.activity=${DISCORD_BOT_ACTIVITY:CUSTOM:v0.1.0-alpha.1}

# Database Configuration
spring.datasource.url=${JDBC_DATABASE_URL:jdbc:postgresql://localhost:5432/warcoat}
spring.datasource.username=${JDBC_DATABASE_USERNAME:warcoat}
spring.datasource.password=${JDBC_DATABASE_PASSWORD:warcoat}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
